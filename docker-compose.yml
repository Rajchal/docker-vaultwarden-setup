version: '3'

services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    ports:
      - "80:80" # Expose HTTP
    volumes:
      - ./data:/data # Persist data on the host
    environment:
      ADMIN_TOKEN: "your_admin_token_here" # Replace with a secure admin token
      WEBSOCKET_ENABLED: "true" # Enable WebSocket notifications
